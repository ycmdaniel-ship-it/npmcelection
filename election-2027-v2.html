<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北角衞理堂｜2027 選舉 V2</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,'PingFang TC',sans-serif;background:#f0f4f8;color:#183049}header{background:#183049;color:white;padding:20px 28px}h1,h2,h3,p{margin:0 0 12px}button,input,select{font:inherit;padding:9px;border:1px solid #c6d1dd;border-radius:7px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#e1edf8}button.primary{background:#194f79;color:white}button:disabled{opacity:.4;cursor:default}main{display:grid;grid-template-columns:240px 1fr;gap:18px;padding:18px}aside,section{background:white;border-radius:12px;padding:18px}aside button{display:block;width:100%;text-align:left;margin:5px 0}aside .active{background:#194f79;color:white}.line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.nom{border:1px solid #dce4eb;border-radius:9px;padding:12px;margin:10px 0}.muted{color:#64748b}.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:6px;max-height:45vh;overflow:auto}.names button{text-align:left}dialog{border:0;border-radius:12px;max-width:850px;width:90%;padding:22px;box-shadow:0 12px 60px #0005}dialog::backdrop{background:#0007}.project{max-width:1400px;margin:auto;padding:30px 5vw}.project h2{font-size:clamp(32px,5vw,72px)}.project .nom{background:white;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:20px}.project .person{font-size:clamp(26px,4vw,54px);font-weight:700}.project .meta{font-size:clamp(18px,2.2vw,30px)}.project .votes{font-size:clamp(30px,5vw,65px);font-weight:bold}.winner{border:3px solid #16815b!important}.tag{color:#16815b;font-weight:bold}.project header{padding:0}.small{font-size:14px}.project .stage{font-size:clamp(20px,3vw,42px);color:#456782}.project .summary{font-size:24px;margin-top:20px} @media(max-width:720px){main{grid-template-columns:1fr}aside{display:flex;overflow:auto}aside button{min-width:140px}}</style><body><div id="app"></div><dialog id="picker"><h2 id="pickTitle"></h2><input id="search" placeholder="搜尋代表姓名" style="width:100%;margin-bottom:12px"><div class="names" id="names"></div><div class="line"><button onclick="picker.close()">取消</button></div></dialog><script>
const roster='余勝意牧師、鍾鳳霞牧師、林崇智牧師、關陸美瑜義務教士、盧序凱義務教士、李玉鳳宣教師、李明康宣教師、魏佩珊宣教師、陳美怡、陳世彥、陳立耀、陳偉文、霍李潔嫻、馮錦略、賀明誠、韓啟榮、韓郭小燕、洪量丰、洪潘蘊霞、林晉楠、李詩天、梁兆邦、伍黃麗鴻、蘇永權、董雅苹、黃陸永恩、黃國強、楊志民、楊尤文祺、楊林幼梅、姚嘉駿、姚謝嘉碧、蔡俊偉、周若松、霍文健、凌焌堅、蘇凌瑞泳、王啟仁、黃廣興、莊潘蘊玲、賀吳苑瑜、呂張玉瑩'.split('、');
const roles=['主席','副主席','書記','司庫','行政媒體部部長','信徒生命培育部部長','宣教差傳部部長','教友關係部部長','崇拜與聖樂部部長','常青牧區區長','成年及家庭牧區區長','在學牧區區長'];const stages=['接受提名','確認候選人','投票／點票進行中','結果已公布'];const fresh=()=>({idx:0,items:roles.map(()=>({stage:0,ns:[],method:'不記名投票',white:'',invalid:'',against:'',abstain:'',note:''}))});const key='npmc-election-v2';let state;try{state=JSON.parse(localStorage.getItem(key))||fresh()}catch{state=fresh()}let draft=['','',''], pickIndex=0, win=null;const projection=location.hash==='#projection';const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cur=()=>state.items[state.idx];function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{}if(win&&!win.closed)win.postMessage({election:state},'*')}function update(){save();render()}window.addEventListener('storage',e=>{if(e.key===key&&e.newValue){state=JSON.parse(e.newValue);render()}});window.addEventListener('message',e=>{if(projection&&e.source===window.opener&&e.data?.election){state=e.data.election;render()}});function openProjection(){win=window.open(location.href.split('#')[0]+'#projection','npmcProjection','width=1280,height=720');if(win)setTimeout(()=>{if(!win.closed)win.postMessage({election:state},'*')},500);else alert('請允許彈出視窗')}
function choose(i){pickIndex=i;document.getElementById('pickTitle').textContent=['選擇被提名人','選擇提議人','選擇和議人'][i];search.value='';showNames();picker.showModal();search.focus()}function showNames(){let q=search.value.trim();names.innerHTML=roster.map((n,i)=>n.includes(q)?`<button onclick="picked(${i})">${esc(n)}</button>`:'').join('')}search.oninput=showNames;function picked(i){draft[pickIndex]=roster[i];picker.close();render()}function add(){if(!draft.every(Boolean))return;if(draft[1]===draft[2])return alert('提議人與和議人須分開記錄');if(cur().ns.some(n=>n.name===draft[0]))return alert('此人已被提名');cur().ns.push({name:draft[0],proposer:draft[1],seconder:draft[2],status:'待確認',votes:'',winner:false});draft=['','',''];update()}function changeRole(i){state.idx=i;draft=['','',''];update()}function status(i,v){cur().ns[i].status=v;update()}function removeNom(i){if(confirm('確定刪除此項提名？')){cur().ns.splice(i,1);update()}}function stage(n){let r=cur();if(n===1&&(r.ns.some(x=>x.status==='待確認')||!r.ns.some(x=>x.status==='接受提名')))return alert('請先確認所有提名，並至少有一位接受提名者。');if(n===3){if(!r.ns.some(x=>x.status==='接受提名'&&x.winner)&&!r.note.trim())return alert('請標示當選者，或填寫未有當選者的結果備註。');if(!confirm('確認已核實結果並向投影公布？'))return;}if(n<r.stage&&!confirm('確定返回較早階段？投影將停止顯示結果。'))return;r.stage=n;update()}function field(k,v){cur()[k]=v;save()}function vote(i,v){cur().ns[i].votes=v;save()}function winner(i,v){cur().ns[i].winner=v;save()}function reset(){if(confirm('清除所有12個崗位的選舉紀錄？此操作不能復原。')){state=fresh();draft=['','',''];update()}}function csv(){const rows=[['崗位','階段','被提名人','提議','和議','狀態','投票方式','得票','當選','反對','棄權','白票','廢票','備註']];state.items.forEach((r,i)=>(r.ns.length?r.ns:[{}]).forEach(n=>rows.push([roles[i],stages[r.stage],n.name,n.proposer,n.seconder,n.status,r.method,n.votes,n.winner?'是':'',r.against,r.abstain,r.white,r.invalid,r.note])));const b=new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='2027選舉紀錄.csv';a.click();URL.revokeObjectURL(a.href)}
function render(){let r=cur();if(projection){let ns=r.stage===0?r.ns:r.ns.filter(n=>n.status==='接受提名');app.innerHTML=`<header><h1>北角衞理堂｜2027年度堂區會職員選舉</h1></header><div class="project"><div class="stage">${stages[r.stage]}</div><h2>${roles[state.idx]}</h2>${ns.map(n=>`<div class="nom ${r.stage===3&&n.winner?'winner':''}"><div><div class="person">${esc(n.name)}</div><div class="meta">提議：${esc(n.proposer)}　｜　和議：${esc(n.seconder)}</div>${r.stage===0?`<div class="meta muted">${esc(n.status)}</div>`:''}</div>${r.stage===3?`<div class="votes">${n.votes===''?'':esc(n.votes)+' 票'} ${n.winner?'<span class="tag">當選</span>':''}</div>`:''}</div>`).join('')||'<p class="stage">等候提名</p>'}${r.stage>=2?`<p class="summary">投票方式：${esc(r.method)}</p>`:''}${r.stage===3?`<p class="summary">${[['反對',r.against],['棄權',r.abstain],['白票',r.white],['廢票',r.invalid]].filter(x=>x[1]!=='').map(x=>x[0]+'：'+esc(x[1])).join('　｜　')}</p><p class="summary">${esc(r.note)}</p>`:''}</div>`;return}
app.innerHTML=`<header><h1>2027年度堂區會職員選舉 V2</h1><div class="line"><button onclick="openProjection()">開啟獨立投影</button><button onclick="csv()">匯出 CSV</button><button onclick="reset()">清除紀錄</button><span>${roster.length} 位代表｜12 個崗位</span></div></header><main><aside>${roles.map((s,i)=>`<button class="${i===state.idx?'active':''}" onclick="changeRole(${i})">${state.items[i].stage===3?'✓ ':''}${s}</button>`).join('')}</aside><section><h2>${roles[state.idx]}</h2><p class="muted">${stages[r.stage]}</p><div class="line">${stages.map((s,i)=>`<button ${i===r.stage?'disabled':''} ${i>r.stage+1?'disabled':''} onclick="stage(${i})">${i+1}. ${s}</button>`).join('')}</div>${r.stage===0?`<h3>新增提名</h3><div class="line">${['被提名人','提議人','和議人'].map((s,i)=>`<button onclick="choose(${i})">${s}：${esc(draft[i]||'按此選擇')}</button>`).join('')}<button class="primary" ${draft.every(Boolean)?'':'disabled'} onclick="add()">加入提名</button></div>`:''}<h3>提名紀錄</h3>${r.ns.map((n,i)=>`<div class="nom"><strong>${esc(n.name)}</strong><p>提議：${esc(n.proposer)}　｜　和議：${esc(n.seconder)}</p><div class="line">${r.stage===0?`<select onchange="status(${i},this.value)">${['待確認','接受提名','婉拒提名'].map(s=>`<option ${n.status===s?'selected':''}>${s}</option>`).join('')}</select><button onclick="removeNom(${i})">刪除</button>`:esc(n.status)}${r.stage>=2&&n.status==='接受提名'?`<label>得票 <input type="number" min="0" step="1" style="width:95px" value="${esc(n.votes)}" onchange="vote(${i},this.value)" ${r.stage===3?'disabled':''}></label><label><input type="checkbox" ${n.winner?'checked':''} onchange="winner(${i},this.checked)" ${r.stage===3?'disabled':''}> 當選</label>`:''}</div></div>`).join('')||'<p class="muted">尚未有提名。</p>'}${r.stage>=2?`<h3>投票紀錄</h3><div class="line"><select onchange="field('method',this.value)" ${r.stage===3?'disabled':''}>${['不記名投票','舉手表決','無競逐／按章則確認'].map(s=>`<option ${r.method===s?'selected':''}>${s}</option>`).join('')}</select>${[['against','反對'],['abstain','棄權'],['white','白票'],['invalid','廢票']].map(([k,s])=>`<label>${s} <input type="number" min="0" step="1" style="width:78px" value="${esc(r[k])}" onchange="field('${k}',this.value)" ${r.stage===3?'disabled':''}></label>`).join('')}</div><label>結果備註 <input style="width:80%" value="${esc(r.note)}" onchange="field('note',this.value)" ${r.stage===3?'disabled':''}></label><p class="small muted">點票數字在公布前不會顯示於投影。當選由書記按會議裁定標示。</p>`:''}</section></main>`}render();
</script></body></html>
